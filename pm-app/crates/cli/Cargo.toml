[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mypm"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
serde_json = "1"
