[package]
name = "tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pm-tui"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }

ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
